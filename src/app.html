<!doctype html>
<!-- biome-ignore lint/a11y/useValidLang: Paraglide lang is valid -->
<html lang="%paraglide.lang%" dir="%paraglide.dir%">
	<head>
		<meta charset="utf-8">

		<link rel="manifest" href="/manifest.webmanifest">

		<meta name="viewport" content="width=device-width, initial-scale=1">

		<meta name="text-scale" content="scale">

		<script nonce="%sveltekit.nonce%">
			(() => {
				let saved;
				try {
					saved = localStorage.getItem("mode-watcher-mode");
				} catch {
					saved = "system";
				}
				const system = matchMedia("(prefers-color-scheme: dark)").matches;
				const dark = saved === "dark" || (saved !== "light" && system);
				document.documentElement.classList.toggle("dark", dark);
			})();
		</script>
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@graph": [
					{
						"@type": "Person",
						"@id": "https://tuentyfaiv.com/#person",
						"name": "Tonalli López",
						"alternateName": "tuentyfaiv",
						"jobTitle": "Frontend Lead",
						"description": "Software engineer focused on frontend",
						"url": "https://tuentyfaiv.com",
						"address": {
							"@type": "PostalAddress",
							"addressLocality": "Mexico City",
							"addressCountry": "MX"
						},
						"knowsAbout": ["Svelte", "TypeScript", "Rust", "Web accessibility"],
						"sameAs": [
							"https://github.com/tuentyfaiv",
							"https://www.linkedin.com/in/tuentyfaiv",
							"https://x.com/tuentyfaiv"
						]
					},
					{
						"@type": "WebSite",
						"@id": "https://tuentyfaiv.com/#website",
						"name": "tuentyfaiv",
						"alternateName": "Tonalli López",
						"url": "https://tuentyfaiv.com",
						"inLanguage": ["en-US", "es-MX"],
						"publisher": { "@id": "https://tuentyfaiv.com/#person" }
					}
				]
			}
		</script>
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div class="app">%sveltekit.body%</div>
	</body>
</html>
